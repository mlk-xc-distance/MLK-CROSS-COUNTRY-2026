const RESULTS = [

const ALL_RESULTS = [...RESULTS, ...RESULTS_2025];

(function render(){
  const list = document.getElementById('resultsList');
  const viewToggle = document.getElementById('viewToggle');
  const athletePicker = document.getElementById('athletePicker');
  const athleteSelect = document.getElementById('athleteSelect');
  let currentView = 'meet';

  function fmtDate(iso){
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' });
  }

  function finisherRows(finishers){
    if (!finishers || finishers.length === 0) return '';
    return finishers.map(f => `
      <div class="finisher-row">
        <div class="finisher-place">${f.place}</div>
        <div class="finisher-name">${f.name}</div>
        <div class="finisher-time">${f.time}</div>
      </div>
    `).join('');
  }

  function renderByMeet(){
    if (ALL_RESULTS.length === 0){
      list.innerHTML = `<div class="callout">No results posted yet — check back after race day.</div>`;
      return;
    }
    const sorted = [...ALL_RESULTS].sort((a, b) => b.date.localeCompare(a.date));
    list.innerHTML = sorted.map(r => `
      <div class="link-card" style="display:block; margin-bottom:18px; cursor:default;">
        <div class="t" style="font-size:18px; margin-bottom:2px;">${r.meetName}${r.season ? ` <span style="font-size:12px; font-weight:600; color:var(--slate); background:var(--stone); border-radius:3px; padding:2px 8px; vertical-align:middle;">${r.season} season</span>` : ''}</div>
        <div class="d" style="margin-bottom:12px;">${fmtDate(r.date)}</div>
        <div class="meet-facts" style="border-top:none; padding-top:0; margin-top:0; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));">
          ${r.boysPlace ? `<div><div class="label" style="color:var(--slate);">Boys Team</div><div class="value" style="color:var(--pine);">${r.boysPlace}</div></div>` : ''}
          ${r.girlsPlace ? `<div><div class="label" style="color:var(--slate);">Girls Team</div><div class="value" style="color:var(--pine);">${r.girlsPlace}</div></div>` : ''}
        </div>
        ${r.topBoys ? `<h4 class="link-subhead" style="margin-top:18px;">Top Boys Finishers</h4>${finisherRows(r.topBoys)}` : ''}
        ${r.topGirls ? `<h4 class="link-subhead" style="margin-top:18px;">Top Girls Finishers</h4>${finisherRows(r.topGirls)}` : ''}
        ${r.resultsLink ? `<div style="margin-top:14px;"><a href="${r.resultsLink}" target="_blank" rel="noopener" style="color:var(--clay); font-weight:600; text-decoration:underline;">Full results →</a></div>` : ''}
      </div>
    `).join('');
  }

  function allAthleteNames(){
    const names = new Set();
    ALL_RESULTS.forEach(r => {
      (r.topBoys || []).forEach(f => names.add(f.name));
      (r.topGirls || []).forEach(f => names.add(f.name));
    });
    return [...names].sort((a, b) => a.localeCompare(b));
  }

  function racesFor(name){
    const races = [];
    [...ALL_RESULTS].sort((a, b) => a.date.localeCompare(b.date)).forEach(r => {
      const hit = [...(r.topBoys || []), ...(r.topGirls || [])].find(f => f.name === name);
      if (hit) races.push({ meetName: r.meetName, date: r.date, place: hit.place, time: hit.time, season: r.season });
    });
    return races;
  }

  function renderByAthlete(){
    const names = allAthleteNames();
    if (names.length === 0){
      list.innerHTML = `<div class="callout">No results posted yet — check back after race day.</div>`;
      athletePicker.style.display = 'none';
      return;
    }
    athletePicker.style.display = 'block';
    if (!athleteSelect.dataset.built){
      athleteSelect.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
      athleteSelect.dataset.built = '1';
      athleteSelect.addEventListener('change', renderByAthlete);
    }
    const selected = athleteSelect.value || names[0];
    const races = racesFor(selected);
    list.innerHTML = `
      <div class="link-card" style="display:block; cursor:default;">
        <div class="t" style="font-size:18px; margin-bottom:14px;">${selected} — Season Progression</div>
        ${races.map(r => `
          <div class="finisher-row">
            <div class="finisher-name" style="flex:1;">${r.meetName}<div style="font-size:12px; color:var(--slate); font-weight:400;">${fmtDate(r.date)}${r.season ? ` · ${r.season} season` : ''}</div></div>
            <div class="finisher-place">${r.place}</div>
            <div class="finisher-time">${r.time}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  viewToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    viewToggle.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    athletePicker.style.display = currentView === 'athlete' ? 'block' : 'none';
    if (currentView === 'meet') renderByMeet(); else renderByAthlete();
  });

  renderByMeet();
})();
</script>
